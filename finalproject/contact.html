<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - National Parks Explorer</title>
    <meta name="description" content="Contact the National Parks Explorer team with any questions or feedback.">
    <meta name="author" content="Godspower Ulonna">
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../styles/normalize.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/large.css">
    
    <script src="scripts/main.js" type="module"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <span class="site-title">National Parks Explorer</span>
            <button id="menu" aria-label="Toggle Navigation Menu"></button>
        </div>
        <nav>
        <ul>
            <li><a href="index.html">Discover</a></li>
            <li><a href="favorites.html">My Favorites</a></li>
            <li><a href="contact.html" class="active">Contact Us</a></li>
        </ul>
        </nav>
    </header>

    <main>
        <div class="intro">
            <h1>Get in Touch</h1>
            <p>We'd love to hear from you. Please fill out the form below.</p>
        </div>
        
        <form action="thankyou.html" method="get" class="contact-form">
            <div class="input-container">
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname" required>
            </div>
            
            <div class="input-container">
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname" required>
            </div>
            
            <div class="input-container">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required title="Please enter a valid email address.">
            </div>

            <div class="input-container">
                <label for="message">Message/Feedback:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            
            <button type="submit" class="action-btn primary-action" style="width: 100%;">Submit Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Godspower Ulonna | WDD 231 Final Project</p>
        <p id="lastModified"></p>
        <p><a href="site-plan.html">Site Plan</a> | <a href="#">Video Demo</a> | <a href="#">Attributions</a></p>
    </footer>
</body>
</html>
